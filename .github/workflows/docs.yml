name: Build Droid docs

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish to GitHub Pages (requires Pages enabled for this repository)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: droid-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require main for public deployment
        if: inputs.deploy && github.ref != 'refs/heads/main'
        run: |
          echo 'Publish documentation from main only.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm --prefix docs ci --no-audit --no-fund
      - name: Build documentation and check internal links
        run: npm --prefix docs run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
