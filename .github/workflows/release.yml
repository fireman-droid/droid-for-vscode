name: Build Droid release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag; leave empty to build main only
        required: false
        type: string
      draft_release:
        description: Create a GitHub Release draft for the existing tag (never publishes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      extensionId: ${{ steps.metadata.outputs.extensionId }}
      sourceSha: ${{ steps.metadata.outputs.sourceSha }}
      sha256: ${{ steps.assets.outputs.sha256 }}
      assetName: ${{ steps.assets.outputs.assetName }}
    steps:
      - name: Require a version tag for a release draft
        shell: pwsh
        env:
          DRAFT_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.draft_release }}
        run: |
          if ($env:DRAFT_REQUESTED -eq 'true' -and -not $env:RELEASE_TAG) {
            throw 'A release draft requires an existing version tag. Leave draft_release unchecked for build-only.'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG && format('refs/tags/{0}', env.RELEASE_TAG) || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require source committed on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release source must be committed on main.' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check release version and changelog
        id: metadata
        run: node scripts/checkRelease.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, enforce budgets and build VSIX
        run: pnpm run package:vsix
      - name: Verify packaged contents
        run: pnpm run verify:vsix
      - name: Prepare release assets
        id: assets
        run: pnpm run release:assets
      - name: Record VSIX digest
        shell: pwsh
        env:
          VERIFIED_TAG: ${{ steps.metadata.outputs.tag }}
          VSIX_SHA256: ${{ steps.assets.outputs.sha256 }}
        run: |
          "### $env:VERIFIED_TAG" >> $env:GITHUB_STEP_SUMMARY
          "VSIX SHA256: $env:VSIX_SHA256" >> $env:GITHUB_STEP_SUMMARY
          'Build verified. Any GitHub Release created by this workflow remains a draft.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: droid-${{ steps.metadata.outputs.tag }}
          path: ${{ steps.assets.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 30
          archive: true

  release_draft:
    needs: build
    if: github.event_name == 'push' || inputs.draft_release
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: droid-${{ needs.build.outputs.tag }}
          path: release
      - name: Verify the exact build artifact
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          ASSET_NAME: ${{ needs.build.outputs.assetName }}
          SOURCE_SHA: ${{ needs.build.outputs.sourceSha }}
        run: |
          $actual = (Get-FileHash -LiteralPath "release/$env:ASSET_NAME" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) { throw 'VSIX digest does not match the verified build.' }
          $info = Get-Content -Raw -LiteralPath release/build-info.json | ConvertFrom-Json
          if ($info.sourceDirty -or $info.sourceSha -ne $env:SOURCE_SHA) { throw 'Release requires the recorded clean source commit.' }
      - name: Create GitHub Release draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_TAG: ${{ needs.build.outputs.tag }}
          ASSET_NAME: ${{ needs.build.outputs.assetName }}
        run: |
          gh release create $env:VERIFIED_TAG --repo $env:GH_REPO --verify-tag --draft --title "Droid $env:VERIFIED_TAG" --notes-file release/RELEASE_NOTES.txt "release/$env:ASSET_NAME" release/SHA256SUMS.txt release/build-info.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
